<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация — VoltMarket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .register-card { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card shadow-sm register-card">
            <div class="card-body p-4">
                <h3 class="text-center mb-4">Регистрация</h3>

                <!-- Сообщение об ошибке -->
                {% if error %}
                <div class="alert alert-danger" role="alert">
                    {{ error }}
                </div>
                {% endif %}

                <!-- Форма регистрации -->
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="username" class="form-label">Имя пользователя</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100 mb-3">Зарегистрироваться</button>
                </form>

                <div class="text-center">
                    <span class="text-muted">Уже есть аккаунт?</span>
                    <a href="/login/" class="text-decoration-none">Войти</a>
                </div>
                <div class="text-center mt-2">
                    <a href="/pages/" class="text-decoration-none text-muted small">← Вернуться на главную</a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
