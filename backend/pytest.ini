# backend/pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = marketplace.settings
python_files = tests.py test_*.py *_tests.py

# 🔹 Искать тесты ТОЛЬКО в папке tests/
testpaths = tests

# 🔹 Игнорировать системные папки и конфиги Django
norecursedirs = marketplace node_modules .git htmlcov .pytest_cache __pycache__

addopts = 
    --verbose
    --cov=main
    --cov-report=term-missing
    --cov-report=html
    --no-migrations

markers =
    unit: Unit tests for isolated functions
    integration: Integration tests with database
    smoke: Quick smoke tests for critical paths
    regression: Full regression test suite
    auth: Tests for authentication and authorization
    services: Tests for Service entity
    orders: Tests for Order entity and business logic
    