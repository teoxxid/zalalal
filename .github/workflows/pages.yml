name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - fix-labs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mock frontend
        working-directory: frontend
        run: npm run build:mock

      - name: Prepare SPA fallback
        run: cp frontend/dist/index.html frontend/dist/404.html

      - name: Verify Pages artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/404.html
          test -d frontend/dist/assets
          echo "Pages artifact:"
          find frontend/dist -maxdepth 2 -type f | sort | head -40

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
