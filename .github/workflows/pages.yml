name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - fix-labs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PAGES_BASE_PATH: /voltmarket-pages/

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build mock frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: ${{ env.PAGES_BASE_PATH }}
        run: npm run build:mock

      - name: Prepare SPA fallback
        run: |
          cp frontend/dist/index.html frontend/dist/404.html
          touch frontend/dist/.nojekyll
          echo "voltmarket-pages ${GITHUB_SHA}" > frontend/dist/pages-health.txt

      - name: Verify Pages artifact
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/404.html
          test -f frontend/dist/.nojekyll
          test -f frontend/dist/pages-health.txt
          test -d frontend/dist/assets
          test -f frontend/dist/minio-files/AppleiPhone16Pro128.jpg
          test -f frontend/dist/minio-files/iphone16pro.mp4
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const basePath = process.env.PAGES_BASE_PATH || '/';
          const escapedBasePath = basePath.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          const html = fs.readFileSync('frontend/dist/index.html', 'utf8');
          const refs = [...html.matchAll(new RegExp(`(?:src|href)="${escapedBasePath}([^"]+)"`, 'g'))].map((match) => match[1]);
          const missing = refs.filter((ref) => !fs.existsSync(path.join('frontend/dist', ref)));
          if (missing.length) {
            console.error('Missing referenced files in Pages artifact:');
            for (const item of missing) console.error(`- ${item}`);
            process.exit(1);
          }
          if (!html.includes(basePath)) {
            console.error(`index.html does not contain expected base path: ${basePath}`);
            process.exit(1);
          }
          console.log(`Verified ${refs.length} referenced Pages files.`);
          NODE
          echo "Pages artifact:"
          find frontend/dist -maxdepth 2 -type f | sort | head -40

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy frontend
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed Pages URL
        run: |
          set -euo pipefail
          url="${{ steps.deployment.outputs.page_url }}"
          echo "Checking ${url}"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL "${url}pages-health.txt"; then
              break
            fi
            echo "Pages is not ready yet, retry ${attempt}/5"
            sleep 10
          done
          curl -fsSI "${url}assets/vendor-Cr4ff58u.js" | tee /tmp/vendor-headers.txt
          grep -qi "content-type:.*javascript" /tmp/vendor-headers.txt

      - name: Print Pages URL
        run: echo "GitHub Pages URL is ${{ steps.deployment.outputs.page_url }}"
